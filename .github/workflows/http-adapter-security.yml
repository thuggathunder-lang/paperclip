name: HTTP adapter security regressions

on:
  push:
    branches:
      - master
    paths:
      - "server/src/adapters/http/**"
      - "server/src/services/remote-http-**"
      - "server/src/__tests__/remote-http-*.test.ts"
      - ".github/workflows/http-adapter-security.yml"
  pull_request:
    paths:
      - "server/src/adapters/http/**"
      - "server/src/services/remote-http-**"
      - "server/src/__tests__/remote-http-*.test.ts"
      - ".github/workflows/http-adapter-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-adapter-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - name: Restore or install workspace dependencies
        uses: ./.github/actions/setup-ci-dependencies
      - name: Run HTTP adapter and outbound endpoint security tests
        run: >-
          pnpm exec vitest run
          server/src/adapters/http/execute.test.ts
          server/src/__tests__/remote-http-endpoint-guard.test.ts
          server/src/__tests__/remote-http-rebinding.test.ts
